services:

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:5.1.2
    container_name: fluent-bit
    restart: unless-stopped

    ports:
      - "127.0.0.1:24224:24224"
      - "127.0.0.1:2020:2020"

    volumes:
      - ./config/fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      - ./logs:/logs

    command:
      - /fluent-bit/bin/fluent-bit
      - -c
      - /fluent-bit/etc/fluent-bit.yaml

    depends_on:
      - loki


  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    restart: unless-stopped

    ports:
      - "127.0.0.1:3100:3100"

    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

    command:
      - -config.file=/etc/loki/local-config.yaml


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    ports:
      - "127.0.0.1:3200:3000"

    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"

      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "${SMTP_HOST}"
      GF_SMTP_USER: "${SMTP_USER}"
      GF_SMTP_PASSWORD: "${SMTP_PASSWORD}"
      GF_SMTP_FROM_ADDRESS: "${SMTP_FROM}"
      GF_SMTP_FROM_NAME: "Production Log Monitoring"
      GF_SMTP_STARTTLS_POLICY: "MandatoryStartTLS"

      ALERT_EMAIL: "${ALERT_EMAIL}"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - loki


volumes:
  loki-data:
  grafana-data:
