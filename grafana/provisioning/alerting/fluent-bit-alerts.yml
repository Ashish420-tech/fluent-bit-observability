apiVersion: 1

groups:
  - orgId: 1
    name: Fluent Bit Log Alerts
    folder: Fluent Bit
    interval: 1m

    rules:

      - uid: fluentbit-error-alert
        title: Fluent Bit Error Detected

        condition: B

        data:

          # A = Count ERROR or NETWORK_ERROR logs from the last minute
          - refId: A
            queryType: instant

            relativeTimeRange:
              from: 60
              to: 0

            datasourceUid: loki

            model:
              datasource:
                type: loki
                uid: loki

              editorMode: code

              expr: 'sum(count_over_time({job="fluentbit",level=~"ERROR|NETWORK_ERROR"}[1m]))'

              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A


          # B = Alert condition: A > 0
          - refId: B
            datasourceUid: __expr__

            relativeTimeRange:
              from: 0
              to: 0

            model:
              datasource:
                type: __expr__
                uid: __expr__

              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt

                  operator:
                    type: and

                  query:
                    params:
                      - B

                  reducer:
                    params: []
                    type: last

                  type: query

              expression: A

              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold


        noDataState: OK
        execErrState: Error

        for: 0s

        annotations:
          summary: "Docker service error detected"
          description: "Fluent Bit/Loki found ERROR or NETWORK_ERROR logs during the last minute."

        labels:
          severity: critical
          source: fluent-bit

        isPaused: false
