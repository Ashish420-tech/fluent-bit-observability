service:
  flush: 1
  log_level: info

  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020

  health_check: on


parsers:
  - name: app_json
    format: json


pipeline:

  inputs:
    - name: forward
      alias: docker_input
      listen: 0.0.0.0
      port: 24224


  filters:
    - name: parser
      match: 'docker.*'
      key_name: log
      parser: app_json
      reserve_data: on
      preserve_key: off


  outputs:

    - name: file
      alias: auth_output
      match: docker.auth
      path: /logs
      file: auth.log
      format: out_file

    - name: file
      alias: catalog_output
      match: docker.catalog
      path: /logs
      file: catalog.log
      format: out_file

    - name: file
      alias: parenting_output
      match: docker.parenting
      path: /logs
      file: parenting.log
      format: out_file

    - name: file
      alias: vendor_output
      match: docker.vendor
      path: /logs
      file: vendor.log
      format: out_file
    - name: loki
      alias: loki_output
      match: 'docker.*'
      host: loki
      port: 3100
      labels: job=fluentbit
      label_keys: $service,$level
      line_format: json
